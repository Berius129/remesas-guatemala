name: Actualizar datos

# Banguat publica las remesas del mes anterior en los primeros días de cada mes.
on:
  schedule:
    - cron: "0 14 8,20 * *"   # días 8 y 20 de cada mes, 08:00 hora de Guatemala
  workflow_dispatch:           # también se puede correr a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: PYTHON=python src/actualizar.sh
      - name: Guardar cambios si hay datos nuevos
        run: |
          if git diff --quiet; then
            echo "Sin datos nuevos."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Actualización automática de datos ($(date -u +%Y-%m-%d))"
          git push
